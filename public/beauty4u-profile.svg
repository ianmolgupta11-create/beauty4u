<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#2A2420" />
      <stop offset="50%" stopColor="#1E1916" />
      <stop offset="100%" stopColor="#120F0D" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#F9E6C3" />
      <stop offset="50%" stopColor="#D4AF37" />
      <stop offset="100%" stopColor="#AA7C11" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="500" height="500" rx="100" fill="url(#bgGrad)" />

  <!-- Outer Architectural Ring -->
  <circle cx="250" cy="250" r="210" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-dasharray="4 4" opacity="0.4" />
  <circle cx="250" cy="250" r="195" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.85" />

  <!-- Botanical Leaf Crest Top -->
  <g transform="translate(250, 110) scale(0.9)" opacity="0.9">
    <path d="M0,0 C-15,-20 0,-40 0,-40 C0,-40 15,-20 0,0 Z" fill="url(#goldGrad)" />
    <path d="M-10,-5 C-25,-15 -20,-35 -20,-35 C-20,-35 -5,-25 -10,-5 Z" fill="url(#goldGrad)" opacity="0.75" />
    <path d="M10,-5 C25,-15 20,-35 20,-35 C20,-35 5,-25 10,-5 Z" fill="url(#goldGrad)" opacity="0.75" />
  </g>

  <!-- Central Monogram & Wordmark -->
  <g text-anchor="middle" font-family="'Cormorant Garamond', 'Didot', 'Playfair Display', serif" fill="url(#goldGrad)">
    <text x="250" y="240" font-size="78" font-weight="600" letter-spacing="4" filter="url(#subtleGlow)">BEAUTY</text>
    <text x="250" y="315" font-size="64" font-weight="300" letter-spacing="14">4 U</text>
  </g>

  <!-- Bottom Subtitle & Divider -->
  <line x1="160" y1="345" x2="340" y2="345" stroke="url(#goldGrad)" stroke-width="1" opacity="0.6" />
  <text x="250" y="375" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="600" letter-spacing="7" fill="#E6D3B3" opacity="0.9">
    BATHURST
  </text>
  <text x="250" y="402" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="400" letter-spacing="4" fill="#A39683">
    HAIR · DERMAL · SPA
  </text>
</svg>
